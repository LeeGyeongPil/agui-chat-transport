# Everything runs against a local mock AG-UI server: no keys, no network services needed.
# The run steps are exactly `npm ci`, `npm run typecheck`, `npm test`; locally,
# `npm ci && npm run ci` runs the same commands in the same order.
# All development tools are plain JavaScript (TypeScript 6 compiler, node:test), so the
# install is the same on every OS and CPU.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    # Pinned on purpose: early Ubuntu 26.04 images (the new `ubuntu-latest`) had runner
    # regressions (actions/runner-images#15343, actions/runner-images#15177).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
