<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>agui-chat-transport web example</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #1c1f24; }
      header { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #fff; border-bottom: 1px solid #dde1e6; }
      header h1 { font-size: 16px; margin: 0; }
      .badge { font-size: 12px; background: #fff4d6; border: 1px solid #e8c766; border-radius: 4px; padding: 2px 6px; margin-left: 8px; }
      main { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; padding: 12px 16px; }
      .panel { background: #fff; border: 1px solid #dde1e6; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
      .panel h2 { font-size: 13px; margin: 0 0 6px; color: #5b6570; text-transform: uppercase; letter-spacing: 0.04em; }
      .msg { margin: 8px 0; }
      .msg b { font-size: 12px; color: #5b6570; display: block; }
      details.reasoning { color: #5b6570; font-size: 13px; }
      .tool { border: 1px solid #c9d3e0; border-radius: 6px; padding: 6px 8px; margin: 6px 0; background: #f2f6fb; font-size: 13px; }
      .error { color: #b3261e; }
      pre { margin: 0; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
      form { display: flex; gap: 8px; margin-top: 8px; }
      input[type="text"] { flex: 1; padding: 8px; border: 1px solid #c3c9d1; border-radius: 6px; }
      button { padding: 8px 14px; border-radius: 6px; border: 1px solid #3b6fd4; background: #3b6fd4; color: #fff; cursor: pointer; }
      button.secondary { background: #fff; color: #3b6fd4; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
